name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run lint + test before deploy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ruff format --check .
          ruff check .
          pytest --cov-config=.coveragerc --cov=app/utils --cov-fail-under=80 -v

      # 只复制源码到服务器（不含 Docker 镜像包，Docker 镜像直接在服务器构建）
      - name: Copy source code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "Dockerfile requirements.txt run.py deploy.sh app/"
          target: "/opt/banksys_sy_hejin/"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/banksys_sy_hejin
            chmod +x deploy.sh
            bash deploy.sh