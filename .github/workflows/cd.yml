name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run lint + test before deploy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ruff format --check .
          ruff check .
          pytest --cov-config=.coveragerc --cov=app/utils --cov-fail-under=80 -v

      - name: Build Docker image
        run: docker build -t banksys_sy_hejin:latest .

      - name: Save image
        run: docker save banksys_sy_hejin:latest | gzip > banksys_sy_hejin.tar.gz

      - name: Copy image and deploy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "banksys_sy_hejin.tar.gz,deploy.sh"
          target: "/opt/banksys_sy_hejin/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/banksys_sy_hejin
            docker load < banksys_sy_hejin.tar.gz
            rm -f banksys_sy_hejin.tar.gz
            chmod +x deploy.sh
            bash deploy.sh